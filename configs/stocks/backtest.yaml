# configs/stocks/backtest.yaml
# A 股统一回测契约：所有 A 股执行统一落盘至 `barra`（vwap_open_30m 时钟）进行组合优化与 Rust 撮合；
# `rq` 域因子/模型或外部宽表信号统一通过 SignalBridge 自动投影至 `barra` 网格。
dataset: "barra"                     # 唯一回测执行数据集（固定为 "barra"）

signal_bridge:
  enabled: true                      # 统一经 SignalBridge 将 rq/外部信号投影至 barra
  source_dataset: "rq"               # "rq" | "barra" | "external_parquet"
  external_signal_path: null         # 如 "./data/raw/stocks/barra/combo/signal/signal_data/shifted_signal.parquet"
  input_signal_alignment: "T_close"  # "T_close" (FactorLibrary 标准) | "T_exec" (shifted_signal 自动前移 1 日)
  min_symbol_match_ratio: 0.90       # 映射覆盖率低于 90% 时显式告警/拦截

timeline:
  start_date: null                   # null 表示使用 barra 全历史起止；可显式指定 "YYYY-MM-DD"
  end_date: null

capital:
  init_cash: 10000000.0

portfolio:
  mode: "barra_qp"                   # "quantile" (分位等权基线) | "barra_qp" (模块化融合凸优化)
  top_quantile: 0.10                 # 多头等权分位比例 (默认 Top 10%)
  industry_neutral: false            # 是否按行业内等选
  max_single_weight: 0.05            # 单只个股最大权重上限 5%
  max_gross_leverage: 1.0            # 纯多头现货最大总仓位 100%
  rebalance_buffer: 0.005            # 0.5% 换手缓冲带
  long_only: true

  # --- barra_qp 模式专属参数（直连 barra 与 RiskStore）---
  optimizer:
    barra_config: "./configs/stocks/barra.yaml"
    benchmark_weight_mode: "mkt_cap_proxy"   # "constituent" | "mkt_cap_proxy" | "absolute_neutral"
    benchmark_weights_path: null             # 补充指数成分权重后可切换 constituent 模式
    proxy_rank_range: [301, 800]             # 市值段模拟中证 500 (null 表示全市场市值加权)

    objective:
      alpha_scale: 1.0
      risk_aversion: 2.5                     # lambda_risk (日频方差量纲)
      turnover_penalty: 0.0015               # lambda_tc (15 bps 单边换手惩罚)
      include_specific_risk: true

    constraints:
      cash_buffer_max: 0.02
      max_single_weight: 0.03
      max_active_weight: 0.015
      max_daily_turnover: 0.15
      style_deviation_default: 0.25
      style_deviation_overrides:
        SIZE: 0.15
        BETA: 0.20
      industry_deviation: 0.02
      respect_t_close_suspend: true

    solver:
      priority: ["MOSEK", "CLARABEL", "OSQP"]
      mosek_license_file: "./configs/stocks/mosek.lic"
      mosek_num_threads: 1
      allow_slack_fallback: true
      slack_penalty: 1000.0

# 信号塑形层 + 动态风控守卫参数（同时驱动原生优化器与策略导出）
strategy:
  h_max: 0.00625                     # 单票权重上限（指数增强顶格仓位）
  tvr: 0.5                           # 单日双边换手硬上限
  mode: horizon                      # single | horizon (双期跨期规划)
  trade_penalty: 0.85                # 对称换手惩罚（horizon 未来期使用）
  persistence: 0.35                  # 次期信号持续性
  discount: 0.8                      # 次期折现因子
  memory: 0.75                       # 慢速 EMA 记忆系数
  vol_weight: 0.12                   # 低波 (RESVOL) 倾斜权重
  ind_neutral_weight: 0.42           # 软行业中性化权重 (0=不中性, 1=完全中性)
  power: 1.8                         # 头部幂次放大系数
  adaptive_stress_guard: true        # Barra SIZE 10 日异动自适应风控
  stress_lookback: 10
  stress_z_window: 252
  stress_cumret_threshold: -0.03
  stress_z_threshold: 1.5
  vol_multiplier: 1.8                # 防守体制下低波惩罚放大倍数
  power_scale: 0.85                  # 防守体制下幂次收缩倍数
  size_tilt: 0.15                    # 防守体制下大市值正向倾斜强度
  asymmetric_trade_penalty:
    buy: 1.00                        # 谨慎建仓（买方换手惩罚更重）
    sell: 0.45                       # 快速止损
  buy_hurdle: true                   # 防追高跳升门槛
  hurdle_penalty: 0.45

execution:
  lot_size: 100
  t_plus_one: true
  allow_short: false
  entry_window: "vwap_open_30m"      # 与 barra 执行时钟严格一致
  price_basis: "hfq"
  reserve_cash: 1.0                  # 现金预留比例（<1 时按该比例归一化真实漂移持仓，如 0.9）

# 内置一键作业预设（由 scripts/run_stocks_backtest.py --profile 调用，免去每次手动改配置）
profiles:
  default:
    description: "主平台标准实盘闭环（Barra QP + A 股非对称税费）"
    portfolio_mode: "barra_qp"
    fee_mode: "asymmetric"
    init_cash: 10000000.0
    reserve_cash: 1.0
    input_signal_alignment: "T_close"
  quantile:
    description: "快速分位等权基线（仍在 barra vwap_open_30m 统一撮合）"
    portfolio_mode: "quantile"
    fee_mode: "asymmetric"
    init_cash: 10000000.0
    reserve_cash: 1.0
    input_signal_alignment: "T_close"
  factorsim_match:
    description: "吸收原 local_backtest/config.yaml 全部作业参数（统一单边 0.003 费率与 0.9 仓位）"
    portfolio_mode: "barra_qp"
    fee_mode: "flat"
    fee_rate: 0.003
    init_cash: 20000000.0
    reserve_cash: 0.9
    start_date: "2020-07-02"
    end_date: "2025-07-02"
    source_dataset: "external_parquet"
    external_signal_path: "./data/raw/stocks/barra/combo/signal/signal_data/shifted_signal.parquet"
    input_signal_alignment: "T_exec"
