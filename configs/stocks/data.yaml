# configs/stocks/data.yaml (A 股双数据源独立托管版：逻辑名 == 目录名)
default_dataset: "rq"                    # 默认研究/特征挖掘数据集: "rq" | "barra"

datasets:
  rq:
    source: "ricequant"
    raw_dir: "./data/raw/stocks/rq"
    derived_dir: "./data/derived/stocks"
    panel_version: "rq"                  # 物理路径 data/derived/stocks/rq (50+ 全量 1d 字段)
    benchmark_id: "000985.XSHG"
    price_basis: "hfq"
    entry_window: "open"
    exec_price_mode: "open_adj"
    extended_fields: true                # 合入 daily_basic / num_trades / 三大指数权重 / intra 收益
    timeline:
      start_date: "2015-11-01"
      end_date: "2026-11-06"             # 与 data/raw/stocks/rq 已落盘最大交易日对齐
    universe_filters:
      exclude_suspended: true            # 剔除停牌日
      exclude_st: true                   # 剔除 ST / *ST 标的
      min_listed_days: 120               # 新股剔除自然日天数阈值
    labels:
      horizons: [1, 2, 5, 10]
      include_idiosyncratic: false       # 运行期加载 rq 时自动通过 RiskView 挂载 barra 的 vwap_open_30m 标签

  barra:
    source: "barra"
    raw_dir: "./data/raw/stocks/barra"
    derived_dir: "./data/derived/stocks"
    panel_version: "barra"               # 物理路径 data/derived/stocks/barra (含 risk_store/)
    benchmark_id: "000905.SH"
    benchmark_csv: "./data/raw/stocks/barra/benchmark_000905_SH.csv"
    price_basis: "hfq"
    entry_window: "vwap_open_30m"
    exec_price_mode: "vwap_open_30m_adj"
    timeline:
      start_date: "2016-01-06"
      end_date: "2026-11-10"             # 与 data/raw/stocks/barra 已落盘最大交易日对齐
    universe_filters:
      use_source_base_univ_mask: true    # 直接使用反极性后的 StockMask2.BaseUnivMask
      exclude_bjse: true                 # 默认剔除北交所 4/8/92 开头标的 (可按需放开)
    labels:
      horizons: [1, 2, 5, 10]
      include_idiosyncratic: true        # 原生构建 y_idio_1/2/5/10 纯特质收益标签
