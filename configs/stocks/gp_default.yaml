seed: 42
mode: "cs"
label: "y_5"

splits:
  train: ["2016-01-01", "2020-12-31"]
  valid: ["2021-01-01", "2022-12-31"]
  test:  ["2023-01-01", "2024-12-31"]

population: 500
generations: 30
islands: 4
migration:
  interval: 10
  k_individuals: 10

limits:
  init_min_depth: 2
  init_max_depth: 5
  max_depth: 6
  max_nodes: 30

variation:
  crossover_prob: 0.60
  subtree_mut_prob: 0.15
  point_mut_prob: 0.10
  hoist_mut_prob: 0.05
  param_mut_prob: 0.10

fitness:
  metric: "ic_ir"
  parsimony_penalty: 0.002
  min_coverage: 0.70
  corr_penalty_threshold: 0.60
  corr_penalty_factor: 0.50

admission:
  min_valid_ic_ir: 0.30
  require_sign_consistency: true
  max_library_corr: 0.60
  max_turnover: 0.85
  top_k_candidates: 200
