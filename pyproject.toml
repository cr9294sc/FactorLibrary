[project]
name = "factorlib"
version = "0.1.0"
description = "FactorLibrary: 期货因子挖掘与回测平台 (Python 研究层 + Rust 计算内核)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "tqdm>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "maturin>=1.7",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/factorlib_core/Cargo.toml"
python-source = "python"
python-packages = ["factorlib", "factorlib_core"]
module-name = "factorlib_core.factorlib_core"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
markers = [
    "realdata: 依赖本地 exports/ 真实数据资产的验收测试 (默认跳过, 使用 --realdata 开启)",
]
