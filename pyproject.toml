[project]
name = "factorlib"
version = "0.1.0"
description = "FactorLibrary: 期货因子挖掘与回测平台 (Python 研究层 + Rust 计算内核)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "tqdm>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "maturin>=1.7",
    "ruff>=0.5",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/factorlib_core/Cargo.toml"
python-source = "python"
python-packages = ["factorlib", "factorlib_core"]
module-name = "factorlib_core.factorlib_core"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
markers = [
    "realdata: 依赖本地 exports/ 真实数据资产的验收测试 (默认跳过, 使用 --realdata 开启)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "legacy",
    "pyrust-bt-main",
    "python/pyrust_bt",
    "python/server_main.py",
    "tests/test_*.py",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line-too-long (handled by formatter / long docstrings allowed)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/audit_data.py" = ["F841", "C414"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

